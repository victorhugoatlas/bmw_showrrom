<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Torugo Motors{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .neon-text-cyan { text-shadow: 0 0 10px rgba(34,211,238,0.7), 0 0 20px rgba(34,211,238,0.4); }
        .neon-text-pink { text-shadow: 0 0 10px rgba(236,72,153,0.7), 0 0 20px rgba(236,72,153,0.4); }
        .neon-border-pink { box-shadow: 0 0 15px rgba(236,72,153,0.25); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-pink-500 selection:text-white">

    <!-- Header Vice City Neon -->
    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-pink-500/30 sticky top-0 z-50 shadow-lg shadow-pink-500/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            
            <!-- Logo -->
            <a href="{% url 'cars_list' %}" class="text-2xl font-black tracking-wider uppercase flex items-center gap-2 group">
                <span class="text-cyan-400 neon-text-cyan group-hover:scale-105 transition-transform">TORUGO</span>
                <span class="text-pink-500 neon-text-pink group-hover:scale-105 transition-transform">MOTORS</span>
            </a>
            
            <!-- Ações do Usuário -->
            <div class="flex items-center gap-3 sm:gap-4">
                {% if user.is_authenticated %}
                    {% if user.is_staff %}
                        <a href="{% url 'brand_list' %}" class="text-xs bg-zinc-800/80 hover:bg-zinc-800 text-cyan-400 font-bold px-3 py-2 rounded-lg border border-cyan-500/30 hover:border-cyan-400 transition-all flex items-center gap-1.5">
                            <i class="fa-solid fa-tags"></i> <span class="hidden sm:inline">Gerenciar Marcas</span>
                        </a>
                    {% endif %}
                    <a href="{% url 'new_car' %}" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-4 py-2 rounded-lg text-xs sm:text-sm transition-all shadow-lg shadow-pink-600/30 hover:shadow-pink-500/50 flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Vender Veículo
                    </a>
                    <a href="{% url 'logout' %}" class="text-zinc-400 hover:text-white text-xs sm:text-sm transition-colors pl-2">Sair</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-zinc-300 hover:text-cyan-400 text-sm font-semibold transition-colors">Entrar</a>
                    <a href="{% url 'register' %}" class="bg-zinc-800 hover:bg-zinc-700 border border-pink-500/40 text-pink-400 hover:text-pink-300 text-sm font-bold px-4 py-2 rounded-lg transition-all">Cadastrar</a>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Conteúdo Dinâmico -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="bg-zinc-900 border-t border-zinc-800/80 py-6 text-center text-zinc-500 text-xs">
        <p>&copy; Torugo Motors — Estilo Vice City Dark Edition.</p>
    </footer>

</body>
</html>
