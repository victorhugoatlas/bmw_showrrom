{% extends 'base.html' %}

{% block title %}Excluir Veículo — Webmotors Dark{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto py-12">
    <div class="bg-zinc-900 border border-red-900/40 rounded-2xl p-6 text-center space-y-6">
        <div class="w-16 h-16 bg-red-950/60 border border-red-800/50 rounded-full flex items-center justify-center mx-auto text-red-500 text-2xl">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <div>
            <h1 class="text-xl font-bold text-white uppercase">Excluir Anúncio?</h1>
            <p class="text-sm text-zinc-400 mt-2">Tem certeza que deseja remover o veículo <strong class="text-white">{{ object.brand.name }} {{ object.model }}</strong>? Esta ação não pode ser desfeita.</p>
        </div>

        <form method="post" class="flex gap-3 justify-center">
            {% csrf_token %}
            <a href="{% url 'car_detail' object.pk %}" class="bg-zinc-800 hover:bg-zinc-700 text-white font-semibold px-5 py-2.5 rounded-lg text-sm border border-zinc-700 transition-colors">
                Cancelar
            </a>
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-2.5 rounded-lg text-sm transition-colors shadow-lg shadow-red-600/20">
                Confirmar Exclusão
            </button>
        </form>
    </div>
</div>
{% endblock %}
