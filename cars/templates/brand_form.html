{% extends 'base.html' %}

{% block title %}Nova Marca — Torugo Motors{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-zinc-900 border border-pink-500/30 rounded-2xl p-6 sm:p-8 space-y-6 shadow-2xl shadow-pink-500/5">
        <div class="border-b border-zinc-800 pb-4">
            <h1 class="text-xl font-black uppercase text-cyan-400">Cadastrar Marca</h1>
            <p class="text-xs text-zinc-400 mt-1">Adicione uma nova fabricante ao sistema.</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs uppercase font-bold text-pink-400 mb-2">Nome da Marca</label>
                {{ form.name }}
                {% if form.name.errors %}
                    <p class="text-xs text-pink-500 mt-1">{{ form.name.errors.0 }}</p>
                {% endif %}
            </div>

            <div class="pt-4 flex items-center justify-end gap-3">
                <a href="{% url 'brand_list' %}" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold px-4 py-2 rounded-lg text-xs transition-colors">Cancelar</a>
                <button type="submit" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-5 py-2 rounded-lg text-xs uppercase tracking-wider transition-all shadow-md shadow-pink-600/30">Salvar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
