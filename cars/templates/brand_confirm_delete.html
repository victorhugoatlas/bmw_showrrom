{% extends 'base.html' %}

{% block title %}Excluir Marca — Torugo Motors{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-zinc-900 border border-pink-900/50 rounded-2xl p-6 text-center space-y-6 shadow-2xl">
        <div class="w-14 h-14 bg-pink-950/60 border border-pink-800/50 rounded-full flex items-center justify-center mx-auto text-pink-500 text-xl">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <div>
            <h1 class="text-lg font-bold text-white uppercase">Excluir Marca?</h1>
            <p class="text-xs text-zinc-400 mt-2">Tem certeza que deseja remover a marca <strong class="text-cyan-400 uppercase">{{ object.name }}</strong>?</p>
        </div>

        <form method="post" class="flex gap-3 justify-center">
            {% csrf_token %}
            <a href="{% url 'brand_list' %}" class="bg-zinc-800 hover:bg-zinc-700 text-white font-semibold px-4 py-2 rounded-lg text-xs border border-zinc-700 transition-colors">Cancelar</a>
            <button type="submit" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-5 py-2 rounded-lg text-xs uppercase tracking-wider transition-all shadow-md shadow-pink-600/30">Confirmar</button>
        </form>
    </div>
</div>
{% endblock %}
